<title>FDE Flow Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --ink:#17211D; --muted:#586964; --line:#D3DCD9; --line-strong:#8FA39D;
  --accent:#1F5FD1; --accent-ink:#FFFFFF; --accent-soft:#E2EBFB; --packet:#D67C06; --done:#EAF0EE; --done-line:#7F9A93;
  --code-bg:#F6F8F7; --hl:#FFF1D6;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1315; --surface:#141C1F; --ink:#E2EBE8; --muted:#93A6A0; --line:#27353A; --line-strong:#577069;
    --accent:#6D9BFF; --accent-ink:#0B1220; --accent-soft:#1A2743; --packet:#F4A73A; --done:#18242A; --done-line:#6F8C85;
    --code-bg:#10181B; --hl:#3A2D12;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1315; --surface:#141C1F; --ink:#E2EBE8; --muted:#93A6A0; --line:#27353A; --line-strong:#577069;
  --accent:#6D9BFF; --accent-ink:#0B1220; --accent-soft:#1A2743; --packet:#F4A73A; --done:#18242A; --done-line:#6F8C85;
  --code-bg:#10181B; --hl:#3A2D12;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 48px}
.shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;padding-top:28px}
header.top{max-width:1240px;margin:0 auto;padding-top:28px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
header.top h1{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:-.02em;margin:0}
header.top p{margin:0;color:var(--muted);max-width:62ch}
nav.index{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 32px);overflow-y:auto;padding-right:4px}
.picker{display:none}
.picker span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.picker select{font:inherit;font-size:15px;width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:6px;padding:8px 10px}
.group-label .mnum{font-family:var(--mono);color:var(--accent);margin-right:6px}
.group-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 6px}
.group ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.group button{all:unset;cursor:pointer;display:block;box-sizing:border-box;width:100%;padding:6px 10px;border-radius:6px;font-size:14px;color:var(--ink)}
.group button:hover{background:var(--surface)}
.group button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.group button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
main{min-width:0;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
h2.ctitle{font-family:var(--display);font-weight:700;font-size:clamp(26px,4vw,38px);letter-spacing:-.02em;line-height:1.1;margin:4px 0 8px;text-wrap:balance}
.thesis{margin:0;font-size:17px;max-width:68ch}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:grid;grid-template-columns:minmax(0,1fr);overflow:hidden}
.stage.has-code{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.diagram{overflow-x:auto;padding:14px 10px 6px}
.diagram svg{display:block;width:100%;min-width:560px;height:auto}
.code{background:var(--code-bg);border-left:1px solid var(--line);overflow:auto;padding:14px 0;font-family:var(--mono);font-size:12.5px;line-height:1.7}
.code .ln{display:block;padding:0 16px;white-space:pre;color:var(--muted);transition:background .3s,color .3s}
.code .ln.on{background:var(--hl);color:var(--ink)}
.code-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 16px 8px;font-family:var(--body);font-weight:600}
.controls{grid-column:1/-1;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 16px}
.btn{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);min-width:84px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:22px;height:6px;border-radius:3px;background:var(--line);border:0;padding:0;cursor:pointer}
.dot.seen{background:var(--done-line)}
.dot.cur{background:var(--accent)}
.speed{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.speed select{font:inherit;font-size:13px;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:6px;padding:3px 6px}
.narration{grid-column:1/-1;border-top:1px solid var(--line);padding:16px 18px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;min-height:118px}
.stepno{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:500;padding-top:3px;font-variant-numeric:tabular-nums}
.narration h3{margin:0;font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:-.01em}
.narration p{grid-column:2;margin:0;max-width:72ch}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.panel h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
.panel ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
.panel li::marker{color:var(--accent)}
.qa{display:flex;flex-direction:column;gap:8px}
.qa details{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.qa summary{cursor:pointer;font-weight:600}
.qa summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.qa details p{margin:8px 0 2px;color:var(--ink)}
.traps li{color:var(--ink)}
/* svg */
.node rect{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.2;transition:fill .35s,stroke .35s}
.node .lbl{font-family:var(--body);font-weight:600;font-size:14px;fill:var(--ink)}
.node .sub{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.node.done rect{fill:var(--done);stroke:var(--done-line)}
.node.on rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.2}
.node.on .lbl{fill:var(--ink)}
.node.ext rect{stroke-dasharray:4 3}
.edge{fill:none;stroke:var(--line-strong);stroke-width:1.4;transition:stroke .35s}
.edge.done{stroke:var(--done-line)}
.edge.on{stroke:var(--accent);stroke-width:2.2;stroke-dasharray:6 5;animation:flow 0.9s linear infinite}
.elabel{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.elabel.on{fill:var(--accent)}
.packet{fill:var(--packet)}
.packet-halo{fill:var(--packet);opacity:.25}
@keyframes flow{to{stroke-dashoffset:-22}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion: reduce){
  .edge.on{animation:none;stroke-dasharray:none}
  .pulse{animation:none}
}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:18px}
  nav.index{display:none}
  .picker{display:flex;flex-direction:column;gap:6px}
  .stage.has-code{grid-template-columns:minmax(0,1fr)}
  .code{border-left:0;border-top:1px solid var(--line);max-height:260px}
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .narration{grid-template-columns:minmax(0,1fr)}
  .narration p{grid-column:1}
  .speed{margin-left:0}
}
</style>

<header class="top">
  <h1>FDE Flow Atlas</h1>
  <p>The FDE Academy curriculum, module by module. Every concept is drawn as a moving flow: press play, or step through with the arrow keys.</p>
</header>

<div class="shell">
  <nav class="index" id="index" aria-label="Concepts"></nav>
  <label class="picker" for="picker"><span>Concept</span><select id="picker"></select></label>
  <main>
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h2 class="ctitle" id="ctitle"></h2>
      <p class="thesis" id="thesis"></p>
    </div>
    <section class="stage" id="stage" aria-label="Animated flow">
      <div class="diagram"><svg id="svg" role="img"></svg></div>
      <div class="code" id="code" hidden></div>
      <div class="controls">
        <button class="btn" id="prev" type="button" aria-label="Previous step">Back</button>
        <button class="btn primary" id="play" type="button">Play</button>
        <button class="btn" id="next" type="button" aria-label="Next step">Next</button>
        <div class="dots" id="dots"></div>
        <label class="speed" for="speedSel">Speed
          <select id="speedSel">
            <option value="1.6">Slow</option>
            <option value="1" selected>Normal</option>
            <option value="0.6">Fast</option>
          </select>
        </label>
      </div>
      <div class="narration" aria-live="polite">
        <div class="stepno" id="stepno"></div>
        <h3 id="stitle"></h3>
        <p id="stext"></p>
      </div>
    </section>
    <div class="cols">
      <div class="panel"><h4>Key ideas</h4><ul id="ideas"></ul></div>
      <div class="panel traps"><h4>Traps interviewers look for</h4><ul id="traps"></ul></div>
    </div>
    <div class="panel"><h4>Interview questions, with a strong answer</h4><div class="qa" id="qa"></div></div>
  </main>
</div>

<script>
const OLD = [
/* ---------------------------------------------------------------- ARC */
{id:"arc", group:"The role", name:"Engagement arc",
 title:"How an FDE engagement actually runs",
 thesis:"You are paid to turn a vague business ask into software running in production at the customer, then feed what you learned back into the product.",
 vb:[710,300],
 nodes:[
  ["ask",90,70,"Vague ask","\"AI for claims\""],
  ["discover",265,70,"Discover","users · data · flow"],
  ["scope",440,70,"Scope","metric · non-goals"],
  ["pilot",615,70,"Pilot build","real data · weeks"],
  ["prod",615,230,"Production","SSO · audit · on-call"],
  ["measure",440,230,"Measure","vs. baseline"],
  ["handoff",265,230,"Hand off","train · runbooks"],
  ["product",90,230,"Core product","generalize"]
 ],
 edges:[["ask","discover"],["discover","scope"],["scope","pilot"],["pilot","prod"],["prod","measure"],["measure","pilot",-40,"iterate"],["measure","handoff"],["handoff","product"]],
 steps:[
  {t:"A vague ask arrives", n:["ask"], d:"\"We want AI for our claims team.\" Treat it as a symptom. Nobody has told you the real problem, who feels it, or how you would know it got better."},
  {t:"Discover on site", n:["discover"], e:["ask>discover"], d:"Sit with the people doing the work. Map the current workflow step by step, find where the data lives and who owns it, and write down one baseline number (for example, 4.2 days average claim cycle time)."},
  {t:"Scope a thin slice", n:["scope"], e:["discover>scope"], d:"Pick one workflow you can change in weeks, not quarters. Agree a success metric, the non-goals, and an executive sponsor who signs off. This is where most engagements are won or lost."},
  {t:"Build the pilot", n:["pilot"], e:["scope>pilot"], d:"Build on the platform with the customer's real data from day one. Demo to real users often, even daily. A demo on fake data proves nothing to the customer."},
  {t:"Harden for production", n:["prod"], e:["pilot>prod"], d:"The unglamorous half: SSO and permissions, audit logs, security review, monitoring, alerting, a runbook and an on-call owner. Pilots that skip this never go live."},
  {t:"Measure and loop", n:["measure","pilot"], e:["prod>measure","measure>pilot"], d:"Compare against the baseline you captured in discovery. Gaps go back into the pilot loop. The number is what gets you the next contract."},
  {t:"Hand off", n:["handoff"], e:["measure>handoff"], d:"Train the customer's team, document it, and reduce their dependency on you. An FDE who stays forever is a services cost, not a product win."},
  {t:"Feed the product", n:["product"], e:["handoff>product"], d:"Anything you built twice for two customers should become a product feature. This is how you avoid custom-code sprawl, the classic FDE failure mode."}
 ],
 ideas:["The FDE model started at Palantir: engineers embedded with customers, shipping on a shared platform instead of writing one-off consulting code.","FDE vs. SWE: a SWE builds for many users from a spec. An FDE finds the spec with one customer, then builds.","FDE vs. solutions architect: an SA designs and advises. An FDE writes and ships the production code.","Your two customers are the client and your own product team."],
 traps:["Jumping to a solution (\"let's build a RAG bot\") before you have a baseline metric.","Building on fake data because real data access is slow. Start the access request on day one.","Letting the pilot become a bespoke fork no one else can maintain."],
 qa:[["Walk me through how you'd run a new customer engagement.","Discover, scope, pilot, productionize, measure, hand off. The key is naming the baseline metric in discovery and the sponsor in scoping, because those two things decide whether the work ships and gets renewed."],
     ["How do you avoid custom-code sprawl?","Build on the core platform, keep customer-specific logic in config or thin adapters, and flag any pattern you've built twice to the product team as a feature request with evidence."],
     ["The customer keeps adding scope mid-pilot. What do you do?","Write each new ask down, tie it to the agreed metric, and trade: if it moves the metric, something else comes out; if it doesn't, it goes on the phase 2 list with the sponsor's agreement."]]
},
/* ---------------------------------------------------------------- CASE */
{id:"case", group:"The role", name:"Case decomposition",
 title:"Decomposing a customer case in an interview",
 thesis:"Case rounds test whether you ask the right questions before you design. Work left to right and say each step out loud.",
 vb:[710,300],
 nodes:[
  ["ask",90,70,"Vague ask","hospital discharges"],
  ["who",265,70,"Who and why","users · sponsor"],
  ["flow",440,70,"Current flow","steps · handoffs"],
  ["data",615,70,"Data reality","EHR · beds · notes"],
  ["metric",615,230,"Success metric","hrs to discharge"],
  ["cons",440,230,"Constraints","PHI · on-prem"],
  ["slice",265,230,"Thin slice","one ward · 6 wks"],
  ["plan",90,230,"Plan and risks","demo · rollout"]
 ],
 edges:[["ask","who"],["who","flow"],["flow","data"],["data","metric"],["metric","cons"],["cons","slice"],["slice","plan"]],
 steps:[
  {t:"Restate the ask", n:["ask"], d:"Prompt: \"A hospital wants to use AI to reduce discharge delays.\" Restate it and confirm the goal: fewer hours between 'medically ready' and 'patient leaves'. Don't design yet."},
  {t:"Who feels it, who pays", n:["who"], e:["ask>who"], d:"Users are nurses, case managers and doctors. The sponsor is the COO, who cares about bed capacity. Ask who will use the tool daily and who signs the contract."},
  {t:"Map the current workflow", n:["flow"], e:["who>flow"], d:"Doctor writes the discharge order, pharmacy reconciles meds, transport is booked, family is called. Ask where the wait actually happens. It is often one handoff, such as pharmacy."},
  {t:"Check the data reality", n:["data"], e:["flow>data"], d:"What's in the EHR, what's in free-text notes, what's on a whiteboard? How fresh is it, and can you get read access? Data access is usually the long pole."},
  {t:"Define success", n:["metric"], e:["data>metric"], d:"Pick one number and its baseline: median hours from ready to discharge, currently 6.5. Add a guardrail metric such as 30-day readmissions so you can't 'win' by rushing patients out."},
  {t:"Name the constraints", n:["cons"], e:["metric>cons"], d:"PHI and HIPAA, on-prem or VPC only, clinicians must stay in the loop, EHR integration limits. Say these before the design, not after."},
  {t:"Propose a thin slice", n:["slice"], e:["cons>slice"], d:"One ward, one bottleneck: a queue that predicts tomorrow's likely discharges from notes and orders so pharmacy starts early. Six weeks, measurable, low risk."},
  {t:"Plan, demo, risks", n:["plan"], e:["slice>plan"], d:"Week plan, what you demo and to whom, how you'd roll out to other wards, and the top risks (data access, clinician trust, model errors) with a mitigation each."}
 ],
 ideas:["Interviewers score the questions you ask as much as the design you land on.","Always pair a success metric with a guardrail metric.","A thin slice beats a platform pitch. Scope to what ships in weeks.","Say the constraints out loud: security, deployment location, humans in the loop."],
 traps:["Opening with the model or architecture choice.","No baseline, so no way to prove value.","Ignoring the people who have to change their workflow."],
 qa:[["What's the first thing you'd do on day one at this hospital?","Shadow a case manager through two or three discharges and file the data access request in parallel, because access will gate everything else."],
     ["How would you measure success?","Median hours from medically-ready to discharge on the pilot ward against a pre-pilot baseline, with readmission rate as a guardrail and a comparison ward as control."],
     ["The model makes a wrong prediction. What happens?","It's a prioritization aid, not a decision. A nurse confirms each item, we log overrides, and those overrides become labeled eval data."]]
},
/* ---------------------------------------------------------------- RAG */
{id:"rag", group:"AI systems", name:"RAG pipeline",
 title:"Retrieval-augmented generation, end to end",
 thesis:"RAG answers questions from the customer's own documents by retrieving relevant chunks at query time and putting them in the prompt. Most failures are retrieval failures, not model failures.",
 vb:[710,380],
 codeTitle:"Assembled prompt",
 code:`SYSTEM: Answer only from the sources below.
Cite sources like [S1]. If they don't cover
the question, say you don't know.

<source id="S1" doc="refund-policy.pdf" p="4">
Refunds are accepted within 30 days...
</source>
<source id="S2" doc="vip-terms.pdf" p="2">
VIP customers may request refunds up to 60 days...
</source>

QUESTION: Can a VIP get a refund after 45 days?

ANSWER: Yes. VIP customers have 60 days [S2],
while the standard window is 30 days [S1].`,
 nodes:[
  ["docs",90,60,"Documents","PDF · wiki · tickets"],
  ["chunk",265,60,"Parse and chunk","~500 tok · overlap"],
  ["embedD",440,60,"Embed","vector per chunk"],
  ["index",615,60,"Vector index","HNSW + BM25 + ACL"],
  ["q",90,190,"User question","\"refund after 45d?\""],
  ["embedQ",265,190,"Embed query","same model"],
  ["retrieve",440,190,"Retrieve top-k","hybrid · filter"],
  ["rerank",615,190,"Rerank","50 → 5"],
  ["prompt",615,320,"Build prompt","rules + sources"],
  ["llm",440,320,"LLM","grounded answer"],
  ["answer",265,320,"Answer","with citations"],
  ["log",90,320,"Log and eval","recall · faithful"]
 ],
 edges:[["docs","chunk"],["chunk","embedD"],["embedD","index"],["q","embedQ"],["embedQ","retrieve"],["index","retrieve",0,"search"],["retrieve","rerank"],["rerank","prompt"],["prompt","llm"],["llm","answer"],["answer","log"]],
 steps:[
  {t:"Ingest documents (offline)", n:["docs"], d:"Pull the customer's sources: PDFs, Confluence, tickets. Keep metadata with every document: source, date, and who is allowed to see it. Parsing tables and scanned PDFs well is half the battle."},
  {t:"Chunk", n:["chunk"], e:["docs>chunk"], d:"Split into pieces of a few hundred tokens with some overlap, following structure (headings, sections) where possible. Bad chunk boundaries split the answer across two chunks and retrieval misses it."},
  {t:"Embed and index", n:["embedD","index"], e:["chunk>embedD","embedD>index"], d:"An embedding model turns each chunk into a vector. Store vectors in an ANN index (HNSW), plus a keyword index (BM25) for exact terms like product codes, with ACL metadata on every row."},
  {t:"A question arrives (online)", n:["q","embedQ"], e:["q>embedQ"], d:"Embed the question with the same model used for the chunks. Optionally rewrite it first, for example expanding acronyms or splitting a compound question."},
  {t:"Retrieve", n:["retrieve","index"], e:["embedQ>retrieve","index>retrieve"], d:"Find nearest neighbours and keyword matches, fuse them (reciprocal rank fusion), and filter by the user's permissions. Filtering by ACL here is what stops the bot leaking HR documents."},
  {t:"Rerank", n:["rerank"], e:["retrieve>rerank"], d:"A cross-encoder scores each (question, chunk) pair more accurately than vector similarity. Take roughly 50 candidates down to the best 5. Cheap and usually the biggest quality jump."},
  {t:"Assemble the prompt", n:["prompt"], e:["rerank>prompt"], d:"System rules, the chunks with source IDs, then the question. Tell the model to cite and to say 'I don't know' when the sources don't cover it. See the prompt on the right.", l:[0,1,2,4,5,6,7,8,9,11]},
  {t:"Generate a grounded answer", n:["llm","answer"], e:["prompt>llm","llm>answer"], d:"The model answers from the sources with citations the user can click to verify. Citations are what earn trust from a skeptical customer.", l:[13,14]},
  {t:"Log and evaluate", n:["log"], e:["answer>log"], d:"Log question, retrieved chunks and answer. Measure retrieval recall@k and answer faithfulness separately. When quality drops, this tells you whether to fix chunking and retrieval or the prompt."}
 ],
 ideas:["RAG vs. fine-tuning: RAG adds knowledge that changes or needs citations. Fine-tuning changes behaviour, format or style. Most enterprise asks are knowledge problems, so start with RAG.","Hybrid search (vectors plus BM25) beats either alone on enterprise text full of IDs and jargon.","Permissions must be enforced at retrieval time, not in the prompt.","Evaluate retrieval and generation separately."],
 traps:["Blaming the LLM when the right chunk was never retrieved.","Chunking tables and PDFs naively.","Stuffing 30 chunks into the prompt instead of reranking to a few."],
 qa:[["Users say the RAG bot gives wrong answers. How do you debug it?","Pull the failing questions, check whether the right chunk was in the retrieved set. If not, it's ingestion, chunking or retrieval; if it was, it's the prompt or model. Turn those cases into an eval set before changing anything."],
     ["When would you fine-tune instead of using RAG?","When the problem is behaviour, not knowledge: a strict output format, a domain style, or a small fast model for a narrow task. Often both: RAG for facts, a fine-tuned or well-prompted model for format."],
     ["How do you stop the bot showing documents a user shouldn't see?","Store ACL metadata per chunk and filter at retrieval using the user's identity from SSO, so restricted text never reaches the prompt."]]
},
/* ---------------------------------------------------------------- TOOLS */
{id:"tools", group:"AI systems", name:"Tool calling and agents",
 title:"The agent loop behind LLM tool calling",
 thesis:"The model never runs anything. It asks your code to call a tool, your code runs it and sends the result back, and this loops until the model answers.",
 vb:[700,310],
 codeTitle:"The loop in Python (Anthropic SDK)",
 code:`tools = [{"name": "get_order",
          "description": "Look up an order by id",
          "input_schema": {"type": "object",
             "properties": {"id": {"type": "string"}}}}]
messages = [{"role": "user", "content": question}]

while True:
    resp = client.messages.create(model=MODEL,
               max_tokens=1024, tools=tools, messages=messages)
    if resp.stop_reason != "tool_use":
        return resp.content[0].text
    messages.append({"role": "assistant", "content": resp.content})
    results = [{"type": "tool_result", "tool_use_id": b.id,
                "content": run_tool(b.name, b.input)}
               for b in resp.content if b.type == "tool_use"]
    messages.append({"role": "user", "content": results})`,
 nodes:[

 codeTitle:"Top 3 regions by 2026 revenue",
 code:`SELECT c.region,
       COUNT(*)       AS orders,
       SUM(o.amount)  AS revenue,
       RANK() OVER (ORDER BY SUM(o.amount) DESC) AS rnk
FROM   orders o
JOIN   customers c ON c.id = o.customer_id
WHERE  o.created_at >= '2026-01-01'
GROUP  BY c.region
HAVING COUNT(*) > 100
ORDER  BY revenue DESC
LIMIT  3;`,

{id:"fastapi", group:"Shipping", name:"FastAPI request lifecycle",

 codeTitle:"A small /ask endpoint",
 code:`app = FastAPI()
app.add_middleware(CORSMiddleware, allow_origins=ORIGINS)

class AskIn(BaseModel):
    question: str = Field(min_length=3)
    top_k: int = 5

class AskOut(BaseModel):
    answer: str
    sources: list[str]

async def current_user(token: str = Depends(oauth2)) -> User:
    return await verify_jwt(token)

@app.post("/ask", response_model=AskOut)
async def ask(body: AskIn, user: User = Depends(current_user)):
    chunks = await retriever.search(body.question,
                 k=body.top_k, groups=user.groups)
    return await llm.answer(body.question, chunks)`,

{id:"resilient", mod:2, sec:"2.1", name:"Resilient API ingestion",
 title:"Clean code against unreliable customer APIs",
 thesis:"Customer systems rate limit, time out and return bad data. Defensive code expects all three: retry what's transient, validate at the boundary, and never drop a bad record silently.",
 vb:[710,420],
 codeTitle:"Python: retries, validation, dead letters",
 code:`@retry(wait=wait_exponential_jitter(initial=1, max=30),
       stop=stop_after_attempt(5),
       retry=retry_if_exception_type(RetryableError))
def fetch_page(cursor: str | None) -> dict:
    r = session.get(URL, params={"cursor": cursor}, timeout=10)
    if r.status_code == 429:
        raise RetryableError(r.headers.get("Retry-After"))
    if r.status_code >= 500:
        raise RetryableError(r.status_code)
    r.raise_for_status()          # 4xx: a bug, don't retry
    return r.json()

def load(rows):
    for row in rows:
        try:
            yield Order.model_validate(row)   # pydantic schema
        except ValidationError as e:
            dead_letter.put(row, str(e))

{id:"acid", mod:2, sec:"2.2", name:"Transactions and ACID",

 codeTitle:"A transfer, and a concurrent reader",
 code:`-- Transaction A
BEGIN;
UPDATE accounts SET balance = balance - 100 WHERE id = 1;
UPDATE accounts SET balance = balance + 100 WHERE id = 2;
-- CHECK (balance >= 0) is enforced on each row
COMMIT;            -- or ROLLBACK if anything failed

-- Transaction B, at the same time (READ COMMITTED)
SELECT balance FROM accounts WHERE id = 1;
-- sees the last committed value until A commits`,

{id:"transformer", mod:3, sec:"3.1", name:"Transformer forward pass",
 title:"Inside a transformer, one token at a time",
 thesis:"Every LLM you deploy is this loop: turn text into tokens, let tokens attend to each other through N layers, predict the next token, append it and repeat.",
 vb:[710,290],
 codeTitle:"One decoder layer in numpy-style code",
 code:`ids = bpe.encode("refund after 45")        # e.g. [19651, 1306, 2548]
x   = E[ids]                                # (T, d_model) embeddings

# ---- attention (per head; positions via RoPE on Q and K) ----
Q, K, V = x @ Wq, x @ Wk, x @ Wv
Q, K    = rope(Q), rope(K)
scores  = Q @ K.T / sqrt(d_k)               # (T, T)
scores += causal_mask                        # can't see the future
w       = softmax(scores, axis=-1)          # rows sum to 1
attn    = w @ V                              # weighted mix of values
# multi-head: h heads in parallel, concat, project with Wo

x = x + attn_block(rms_norm(x))             # residual connection
x = x + ffn(rms_norm(x))                    # per-token MLP (SwiGLU)
# ... repeat for N layers ...

logits = rms_norm(x)[-1] @ W_vocab          # scores for next token
next_id = sample(softmax(logits / temperature))`,
 nodes:[
  ["text",90,70,"Text","\"refund after 45\""],
  ["tok",265,70,"BPE tokenizer","→ token ids"],
  ["emb",440,70,"Embeddings","+ RoPE positions"],
  ["attn",615,70,"Self-attention","multi-head"],
  ["add1",615,220,"Add + RMSNorm","residual"],
  ["ffn",440,220,"Feed-forward","per-token MLP"],
  ["add2",265,220,"Add + RMSNorm","× N layers"],
  ["logits",90,220,"Next token","softmax · sample"]
 ],
 edges:[["text","tok"],["tok","emb"],["emb","attn"],["attn","add1"],["add1","ffn"],["ffn","add2"],["add2","logits"],["logits","text",0,"append, repeat"]],
 steps:[
  {t:"Tokenize", n:["text","tok"], e:["text>tok"], d:"Byte-Pair Encoding merges frequent byte sequences into tokens. Cost, latency and context limits are all counted in tokens, and code, numbers and non-English text often need more tokens per word.", l:[0]},
  {t:"Embed", n:["emb"], e:["tok>emb"], d:"Each token id becomes a vector. Similar meanings end up close together, measured by cosine similarity, dot product or Euclidean distance. The same idea powers embedding search in RAG.", l:[1]},
  {t:"Queries, keys, values", n:["attn"], e:["emb>attn"], d:"Each token produces a query (what I'm looking for), a key (what I contain) and a value (what I pass on). RoPE rotates Q and K by position so attention knows word order.", l:[3,4,5]},
  {t:"Scaled dot-product attention", n:["attn"], d:"Scores are Q·Kᵀ divided by √d_k so the softmax doesn't saturate as dimensions grow. The causal mask stops a token looking at later tokens. Each token's output is a weighted mix of the others' values.", l:[6,7,8,9]},
  {t:"Many heads", n:["attn"], d:"Multi-head attention runs several attention patterns in parallel, one might track syntax, another references, then concatenates and projects them.", l:[10]},
  {t:"Residual and normalization", n:["add1"], e:["attn>add1"], d:"The attention output is added back to the input (a residual connection) so information and gradients flow through deep stacks. RMSNorm keeps activations in a stable range.", l:[12]},
  {t:"Feed-forward", n:["ffn","add2"], e:["add1>ffn","ffn>add2"], d:"A two-layer MLP applied to each token separately. Much of the model's stored knowledge lives in these weights. Then another residual add, and the whole block repeats N times.", l:[13,14]},
  {t:"Predict, append, repeat", n:["logits","text"], e:["add2>logits","logits>text"], d:"The last position's vector is projected to a score per vocabulary token, sampled with a temperature, appended, and the loop runs again. A KV cache stores past keys and values so each new token is cheap.", l:[16,17]}
 ],
 ideas:["Encoder-only (BERT): sees both directions; used for embeddings and classification.","Decoder-only (GPT, Claude, Llama): causal; used for generation.","Encoder-decoder (T5): encoder reads input, decoder generates; translation and summarization.","Attention cost grows with the square of sequence length, which is why long contexts are slower and pricier.","Latency has two parts: prefill (reading the prompt, parallel) and decode (one token at a time)."],
 traps:["Saying the model 'looks up' facts; it predicts tokens from learned weights.","Estimating cost in words instead of tokens.","Confusing embeddings from an embedding model with a chat model's internal states."],
 qa:[["Why divide attention scores by the square root of d_k?","Dot products grow with dimension; large scores push softmax into near one-hot outputs with tiny gradients. Scaling keeps them in a trainable range."],
     ["Why does a long prompt raise latency and cost?","You pay per input token, prefill compute grows with length (attention is quadratic), and the KV cache uses more memory, which limits batch size."],
     ["Cosine similarity vs. dot product for embeddings?","Cosine ignores vector length and compares direction only. Dot product includes magnitude. For normalized embeddings they rank the same."]]
},
{id:"context", mod:3, sec:"3.2", name:"Context engineering",
 title:"Context engineering: the window is RAM, the model is CPU",
 thesis:"Prompt engineering tunes the wording of one instruction. Context engineering decides everything the model sees on every call. Most 'hallucinations' in production are missing or wrong context.",
 vb:[720,420],
 codeTitle:"A context budget for one call",
 code:`CONTEXT BUDGET   (window 200k · target under 60k)
  system instructions ........  1,800 tok
  dialogue history ...........  6,000 tok  older turns summarized
  RAG chunks (top 5) .........  3,500 tok  reranked, with ids
  tool schemas (6 tools) .....  2,400 tok
  tool outputs ...............  9,000 tok  large JSON trimmed
  user state / profile .......    300 tok  role, region, perms
  output constraints .........    400 tok  JSON schema
  -------------------------------------------
  total ......................  23,400 tok

"Hallucinated a refund policy" -> was the policy chunk
in the window?  No  -> fix retrieval, not the wording.`,
 nodes:[
  ["instr",90,40,"Instructions","system prompt"],
  ["hist",90,105,"History","summarized"],
  ["rag",90,170,"RAG chunks","retrieved"],
  ["tools",90,235,"Tool schemas","+ tool outputs"],
  ["state",90,300,"User state","role · perms"],
  ["fmt",90,365,"Output format","schema"],
  ["window",310,202,"Context window","the RAM"],
  ["llm",480,202,"LLM","the CPU"],
  ["out",650,202,"Output","or runtime error"]
 ],
 edges:[["instr","window",-40],["hist","window"],["rag","window"],["tools","window"],["state","window"],["fmt","window",40],["window","llm"],["llm","out"],["out","window",-120,"debug context"]],
 steps:[
  {t:"From vibes to engineering", n:["instr"], d:"Vibe coding iterates by feel. Prompt engineering tunes the wording of instructions. Context engineering designs the whole input: what goes in, in what order, within what budget.", l:[1]},
  {t:"Dialogue history", n:["hist"], e:["hist>window"], d:"Keep recent turns verbatim and summarize older ones. Unbounded history crowds out everything else.", l:[2]},
  {t:"Retrieved knowledge", n:["rag"], e:["rag>window"], d:"A few reranked chunks with source ids beat thirty raw ones. Relevance per token is the goal.", l:[3]},
  {t:"Tools and their outputs", n:["tools"], e:["tools>window"], d:"Tool schemas cost tokens on every call, and tool outputs can be huge. Trim JSON to the fields the model needs.", l:[4,5]},
  {t:"User state and output constraints", n:["state","fmt"], e:["state>window","fmt>window"], d:"Who the user is and what they're allowed to see, plus the exact output shape you'll parse.", l:[6,7]},
  {t:"The window is RAM", n:["window"], d:"Karpathy's mental model: the LLM is a CPU and the context window is its RAM. It's finite, everything competes for it, and position matters: models attend less reliably to the middle of long contexts.", l:[0,8,9]},
  {t:"Context as a compiler", n:["llm","out"], e:["window>llm","llm>out"], d:"Treat the assembled context like source code and the model like a compiler: the same model gives a correct or broken output depending on what you fed it."},
  {t:"Hallucination as a runtime error", n:["window","out"], e:["out>window"], d:"When the output is wrong, inspect what was actually in the window before rewording anything. Usually the needed fact was missing, stale or buried.", l:[11,12]}
 ],
 ideas:["Components: instructions, dialogue history, RAG chunks, tool schemas and outputs, user state, output constraints.","Budget tokens per component and log the assembled context for every call.","Debug by reading the exact context the model saw.","Less, more relevant context usually beats more context."],
 traps:["Rewording the prompt to fix what is really a retrieval bug.","Pasting whole documents because the window is large.","Not logging assembled context, so failures can't be reproduced."],
 qa:[["Prompt engineering vs. context engineering?","Prompt engineering optimizes the wording of instructions. Context engineering is the system that decides everything in the window per call: history, retrieval, tools, state and format, within a token budget."],
     ["The agent invented a policy that doesn't exist. How do you fix it?","Pull the trace and check whether the real policy was in the context. If not, fix retrieval or tool access; if it was buried, rerank and trim; then add an instruction to say 'I don't know' and an eval case."],
     ["Why not just use a 1M-token window?","Cost and latency grow with tokens, and accuracy drops when the relevant fact is buried among irrelevant text. Curated context is cheaper and more accurate."]]
},
{id:"ace", mod:3, sec:"3.3", name:"Agentic Context Engineering",
 title:"ACE: contexts that learn without collapsing",
 thesis:"Stanford's Agentic Context Engineering treats the context as an evolving playbook. Three roles generate, reflect and curate, and changes are small deltas, so hard-won detail isn't lost.",
 vb:[710,290],
 codeTitle:"An evolving playbook",
 code:`## PLAYBOOK  (itemized · grows by delta updates)
[str-012] helpful=7 harmful=0
  For invoice APIs, page with a cursor, not an offset.
[err-004] helpful=3 harmful=1
  Vendor feed dates are DD/MM; parse explicitly.
[tool-021] helpful=5 harmful=0
  Call get_schema before writing SQL on a new table.

## DELTA from the Curator (this run)
+ [err-009] On 429, wait for Retry-After before retrying.
~ [err-004] harmful += 1   (US vendor uses MM/DD)`,

  {t:"Two failure modes", n:["collapse"], d:"Brevity bias: prompt optimizers compress instructions into short, generic advice and drop domain detail. Context collapse: when a model rewrites the whole context each round, it gradually erodes into something much shorter and worse."},
  {t:"A task arrives", n:["task","gen"], e:["task>gen"], d:"The Generator tackles it using the current playbook as context.", l:[0]},

  {t:"Curate as deltas", n:["cur"], e:["ins>cur"], d:"The Curator turns lessons into small, itemized edits: add a bullet, bump a helpful or harmful counter. It never rewrites the whole playbook.", l:[8,9,10]},

 ],
 ideas:["Roles: Generator, Reflector, Curator.","Evolving playbook of itemized strategies, not one monolithic prompt.","Delta updates preserve detail and are cheap to apply.","Letta's Context-Bench evaluates agents on multi-hop retrieval over files using tools like grep_files and open_files: a test of how well a model manages its own context."],
 traps:["Letting an LLM rewrite a long system prompt end to end every iteration.","Keeping lessons with no counters, so bad advice never gets pruned."],
 qa:[["What's context collapse and how do you prevent it?","Iteratively rewriting the full context makes it shrink and lose detail. Prevent it with itemized delta updates, as in ACE, and by keeping history of what each change did."],
     ["How would you apply ACE to a customer's support agent?","Log every resolved and failed ticket trajectory, have a reflector extract lessons, have a curator add them as tagged playbook items with counters, and gate new items through evals before they go live."],
     ["Why separate Reflector and Curator?","Reflection is analysis; curation is editing with rules (dedupe, merge, prune). Splitting them keeps each prompt focused and the playbook consistent."]]

{id:"finetune", mod:3, sec:"3.4", name:"LoRA, QLoRA, distillation",
 title:"Adapting a model: LoRA, QLoRA and distillation",
 thesis:"When prompting and RAG aren't enough, you change the model. LoRA trains a tiny add-on instead of all the weights, QLoRA does it on a 4-bit base to fit one GPU, and distillation teaches a small model to imitate a big one.",
 vb:[710,290],
 codeTitle:"QLoRA setup with Hugging Face PEFT",
 code:`bnb = BitsAndBytesConfig(load_in_4bit=True,
        bnb_4bit_quant_type="nf4",
        bnb_4bit_compute_dtype=torch.bfloat16)
model = AutoModelForCausalLM.from_pretrained(BASE,
        quantization_config=bnb)            # frozen, 4-bit

cfg = LoraConfig(r=16, lora_alpha=32, lora_dropout=0.05,
        target_modules=["q_proj", "v_proj"])
model = get_peft_model(model, cfg)
model.print_trainable_parameters()          # well under 1%

# distillation: student matches teacher's distribution
loss = kl_div(log_softmax(student_logits / T),
              softmax(teacher_logits / T)) * T**2`,

  {t:"Distillation", n:["teacher","student"], e:["teacher>student"], d:"A large teacher model produces outputs or probability distributions; a small student learns to match them. You get most of the quality at a fraction of the latency and cost.", l:[11,12,13]},
  {t:"Serve the cheap model", n:["serve"], e:["student>serve"], d:"Distilled or adapted small models are how you hit tight latency, cost or on-prem constraints."},

  document.getElementById('ctitle').textContent=c.title;
  document.getElementById('thesis').textContent=c.thesis;
  const list=(id,arr)=>{const u=document.getElementById(id);u.innerHTML='';arr.forEach(t=>{const li=document.createElement('li');li.textContent=t;u.appendChild(li)})};
  list('ideas',c.ideas);list('traps',c.traps);
  const qa=document.getElementById('qa');qa.innerHTML='';
  c.qa.forEach(([q,a])=>{const d=document.createElement('details');const s=document.createElement('summary');s.textContent=q;const p=document.createElement('p');p.textContent=a;d.append(s,p);qa.appendChild(d)});
  // code
  const code=document.getElementById('code'),stage=document.getElementById('stage');
  if(c.code){code.hidden=false;stage.classList.add('has-code');code.innerHTML='';const tt=document.createElement('div');tt.className='code-title';tt.textContent=c.codeTitle||'Code';code.appendChild(tt);
    c.code.split('\n').forEach((ln,i)=>{const s=document.createElement('span');s.className='ln';s.dataset.i=i;s.textContent=ln||' ';code.appendChild(s)});}
  else{code.hidden=true;stage.classList.remove('has-code');}
  drawDiagram(c);
  const dots=document.getElementById('dots');dots.innerHTML='';
  c.steps.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.className='dot';b.setAttribute('aria-label','Step '+(i+1)+': '+s.t);b.onclick=()=>{stop();go(i)};dots.appendChild(b)});
  try{history.replaceState(null,'','#'+c.id)}catch(e){}
  try{localStorage.setItem('fde-atlas-last',c.id)}catch(e){}
  go(0);
  if(!reduced) play(); else stop();
  if(fromUser) window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});
}

function drawDiagram(c){
  svg.innerHTML='';svg.setAttribute('viewBox','0 0 '+c.vb[0]+' '+c.vb[1]);
  svg.setAttribute('aria-label',c.title);
  const defs=el('defs',{},svg);
  [['ar','var(--line-strong)'],['ar-done','var(--done-line)'],['ar-on','var(--accent)']].forEach(([id,col])=>{
    const m=el('marker',{id,viewBox:'0 0 10 10',refX:'8',refY:'5',markerWidth:'7',markerHeight:'7',orient:'auto-start-reverse'},defs);
    const p=el('path',{d:'M0,0 L10,5 L0,10 z'},m);p.style.fill=col;});
  const pos={};c.nodes.forEach(n=>pos[n[0]]=[n[1],n[2]]);
  const gE=el('g',{},svg),gL=el('g',{},svg),gN=el('g',{},svg);
  c._edges={};
  c.edges.forEach(e=>{
    const [f,t,bend=0,label]=e;const a=pos[f],b=pos[t];
    let d,mid;
    if(bend){const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);const nx=-dy/len,ny=dx/len;
      const cx=(a[0]+b[0])/2+nx*bend,cy=(a[1]+b[1])/2+ny*bend;
      const s=trim(a[0],a[1],cx,cy,3),en=trim(b[0],b[1],cx,cy,5);
      d='M'+s[0]+','+s[1]+' Q'+cx+','+cy+' '+en[0]+','+en[1];mid=[(s[0]+2*cx+en[0])/4,(s[1]+2*cy+en[1])/4];}
    else{const s=trim(a[0],a[1],b[0],b[1],3),en=trim(b[0],b[1],a[0],a[1],5);d='M'+s[0]+','+s[1]+' L'+en[0]+','+en[1];mid=[(s[0]+en[0])/2,(s[1]+en[1])/2];}
    const p=el('path',{d,class:'edge','marker-end':'url(#ar)'},gE);
    let lt=null;
    if(label){const off=bend?(bend>0?-6:12):-7;lt=el('text',{x:mid[0],y:mid[1]+off,'text-anchor':'middle',class:'elabel'},gL);lt.textContent=label;}
    c._edges[f+'>'+t]={p,lt};
  });
  c._nodes={};
  c.nodes.forEach(n=>{
    const [id,x,y,lbl,sub,ext]=n;
    const g=el('g',{class:'node'+(ext?' ext':'')},gN);
    el('rect',{x:x-W/2,y:y-H/2,width:W,height:H,rx:8},g);
    const t1=el('text',{x,y:y-3,'text-anchor':'middle',class:'lbl'},g);t1.textContent=lbl;
    const t2=el('text',{x,y:y+14,'text-anchor':'middle',class:'sub'},g);t2.textContent=sub;
    [t1,t2].forEach(t=>{try{if(t.getComputedTextLength()>W-12){t.setAttribute('textLength',W-12);t.setAttribute('lengthAdjust','spacingAndGlyphs');}}catch(e){}});
    c._nodes[id]=g;
  });
  const pk=el('g',{},svg);
  c._halo=el('circle',{r:11,class:'packet-halo',cx:-50,cy:-50},pk);
  c._dot=el('circle',{r:5.5,class:'packet',cx:-50,cy:-50},pk);
}

function go(i){
  const c=cur;step=Math.max(0,Math.min(c.steps.length-1,i));
  const seenN=new Set(),seenE=new Set();
  for(let k=0;k<step;k++){(c.steps[k].n||[]).forEach(x=>seenN.add(x));(c.steps[k].e||[]).forEach(x=>seenE.add(x));}
  const s=c.steps[step];const onN=new Set(s.n||[]),onE=new Set(s.e||[]);
  for(const id in c._nodes){const g=c._nodes[id];g.classList.toggle('on',onN.has(id));g.classList.toggle('done',!onN.has(id)&&seenN.has(id));g.classList.toggle('pulse',onN.has(id)&&!(s.e||[]).length);}
  for(const k in c._edges){const {p,lt}=c._edges[k];const on=onE.has(k),dn=!on&&seenE.has(k);
    p.classList.toggle('on',on);p.classList.toggle('done',dn);
    p.setAttribute('marker-end','url(#'+(on?'ar-on':dn?'ar-done':'ar')+')');
    if(lt)lt.classList.toggle('on',on);}
  document.getElementById('stepno').textContent=String(step+1).padStart(2,'0')+' / '+String(c.steps.length).padStart(2,'0');
  document.getElementById('stitle').textContent=s.t;
  document.getElementById('stext').textContent=s.d;
  const lines=new Set(s.l||[]);let first=null;
  document.querySelectorAll('#code .ln').forEach(ln=>{const on=lines.has(+ln.dataset.i);ln.classList.toggle('on',on);if(on&&!first)first=ln;});
  if(first){const box=document.getElementById('code');const top=first.offsetTop-box.offsetTop-40;box.scrollTo({top:Math.max(0,top),behavior:reduced?'auto':'smooth'});}
  document.querySelectorAll('#dots .dot').forEach((d,k)=>{d.classList.toggle('cur',k===step);d.classList.toggle('seen',k<step);d.setAttribute('aria-current',k===step?'step':'false')});
  animatePackets(s.e||[]);
  if(playing) schedule();
}

function animatePackets(keys){
  const c=cur,tok=++animToken;const dot=c._dot,halo=c._halo;
  const paths=keys.map(k=>c._edges[k]&&c._edges[k].p).filter(Boolean);
  const hide=()=>{dot.setAttribute('cx',-50);dot.setAttribute('cy',-50);halo.setAttribute('cx',-50);halo.setAttribute('cy',-50);};
  if(!paths.length||reduced){hide();return;}
  let idx=0,t0=null;const dur=950*speed;
  function frame(ts){
    if(tok!==animToken)return;
    if(t0===null)t0=ts;
    const p=paths[idx];const L=p.getTotalLength();let u=(ts-t0)/dur;
    if(u>=1){idx++;t0=ts;if(idx>=paths.length){idx=0;hide();t0=ts+500*speed;}requestAnimationFrame(frame);return;}
    if(u<0){requestAnimationFrame(frame);return;}
    const e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    const pt=p.getPointAtLength(L*e);
    dot.setAttribute('cx',pt.x);dot.setAttribute('cy',pt.y);halo.setAttribute('cx',pt.x);halo.setAttribute('cy',pt.y);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function dwell(){const s=cur.steps[step];return (Math.max(4200,(s.e||[]).length*1100+s.d.length*42))*speed;}
function schedule(){clearTimeout(timer);timer=setTimeout(()=>{if(step<cur.steps.length-1)go(step+1);else stop(true);},dwell());}
function play(){if(step>=cur.steps.length-1)go(0);playing=true;document.getElementById('play').textContent='Pause';schedule();}
function stop(ended){playing=false;clearTimeout(timer);document.getElementById('play').textContent=ended?'Replay':'Play';}

document.getElementById('play').onclick=()=>playing?stop():play();
document.getElementById('next').onclick=()=>{stop();go(step+1)};
document.getElementById('prev').onclick=()=>{stop();go(step-1)};
document.getElementById('speedSel').onchange=e=>{speed=+e.target.value;if(playing)schedule();};
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('select,summary,input'))return;
  if(e.key==='ArrowRight'){stop();go(step+1);e.preventDefault();}
  else if(e.key==='ArrowLeft'){stop();go(step-1);e.preventDefault();}
  else if(e.key===' '&&e.target===document.body){playing?stop():play();e.preventDefault();}
});

buildIndex();
document.getElementById('picker').onchange=e=>load(e.target.value,true);
let start=(location.hash||'').slice(1);
if(!C.some(c=>c.id===start)){try{start=localStorage.getItem('fde-atlas-last')||''}catch(e){start=''}}
load(C.some(c=>c.id===start)?start:'genesis',false);
</script>
