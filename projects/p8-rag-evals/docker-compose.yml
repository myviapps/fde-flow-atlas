# Optional: Postgres with the pgvector extension, for the pgvector stretch goal.
# Start: docker compose up -d     Stop: docker compose down
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag-local-only
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
